[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-coding-agent"
version = "1.0.0"
description = "Resolves GitHub issues in a controlled repository through MCP servers, orchestrated with LangGraph and powered by Claude, with a human approving every change."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vaishnavi Karingala" }]
keywords = ["ai-agent", "mcp", "model-context-protocol", "langgraph", "claude", "anthropic", "coding-agent", "github", "human-in-the-loop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development",
]
dependencies = [
    "anthropic>=2.0",
    "mcp>=2.0",
    "httpx2>=2.0",
    "jsonschema>=4.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "aiosqlite>=0.20",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/vaishnavi-git/mcp-coding-agent"
Documentation = "https://github.com/vaishnavi-git/mcp-coding-agent/tree/main/docs"
Issues = "https://github.com/vaishnavi-git/mcp-coding-agent/issues"

[project.optional-dependencies]
ui = ["streamlit>=1.40"]
dev = ["pytest>=8", "pytest-cov>=5", "pyyaml>=6", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
# The test categories (discovery, path_traversal, ...) are registered in tests/conftest.py
# from tests/spec_matrix.py.
markers = ["docker: needs a running Docker daemon"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = false
skip_covered = false
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
target-version = "py311"
line-length = 200

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]
# B008: FastAPI's Depends(...) defaults are idiomatic. UP042: Risk(str, Enum) keeps its str() output.
# SIM108: nested one-line ternaries read worse than the if/else blocks they would replace.
ignore = ["B008", "UP042", "SIM108"]
