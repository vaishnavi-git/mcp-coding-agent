name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.6"
      - run: ruff check app scripts tests

  test:
    name: Tests (Docker sandbox included)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[ui,dev]"  # ui: the UI tests drive the Streamlit page
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the test sandbox images
        run: |
          docker build -t mcp-agent-sandbox:latest sandbox/
          docker build -t mcp-agent-sandbox-js:latest sandbox/javascript/
          docker build -t mcp-agent-sandbox-java:latest sandbox/java/
      - name: Run the test suite
        # No API key or network access to GitHub is needed: the model is scripted and GitHub is mocked.
        run: pytest -o addopts="-q --strict-markers" -rs --cov=app --cov-report=term
      - name: Coverage summary
        if: always()
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
